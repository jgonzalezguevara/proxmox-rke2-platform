---
- name: Install Rancher platform
  hosts: rke2_servers
  gather_facts: true
  become: true

  vars:
    kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    helm_binary_path: /usr/local/bin/helm
    helm_arch: amd64
    helm_archive: "helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    helm_download_url: "https://get.helm.sh/{{ helm_archive }}"
    helm_checksum_url: "{{ helm_download_url }}.sha256sum"
    helm_extract_dir: "/opt/helm/{{ helm_version }}"

  tasks:
    - name: Verify supported architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: >-
          Rancher automation currently supports x86_64 only.
          Detected architecture: {{ ansible_architecture }}.
      run_once: true

    - name: Create Helm extraction directory
      ansible.builtin.file:
        path: "{{ helm_extract_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      run_once: true

    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "{{ helm_download_url }}"
        dest: "/tmp/{{ helm_archive }}"
        owner: root
        group: root
        mode: "0644"
      run_once: true

    - name: Download Helm checksum
      ansible.builtin.get_url:
        url: "{{ helm_checksum_url }}"
        dest: "/tmp/{{ helm_archive }}.sha256sum"
        owner: root
        group: root
        mode: "0644"
      run_once: true

    - name: Verify Helm archive checksum
      ansible.builtin.command:
        cmd: "sha256sum -c {{ helm_archive }}.sha256sum"
        chdir: /tmp
      register: helm_checksum
      changed_when: false
      run_once: true

    - name: Extract Helm
      ansible.builtin.unarchive:
        src: "/tmp/{{ helm_archive }}"
        dest: "{{ helm_extract_dir }}"
        remote_src: true
        creates: "{{ helm_extract_dir }}/linux-{{ helm_arch }}/helm"
      run_once: true

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "{{ helm_extract_dir }}/linux-{{ helm_arch }}/helm"
        dest: "{{ helm_binary_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      run_once: true

    - name: Configure Jetstack Helm repository
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io
        binary_path: "{{ helm_binary_path }}"
      run_once: true

    - name: Configure Rancher stable Helm repository
      kubernetes.core.helm_repository:
        name: rancher-stable
        repo_url: https://releases.rancher.com/server-charts/stable
        binary_path: "{{ helm_binary_path }}"
      run_once: true

    - name: Install cert-manager
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        chart_version: "{{ cert_manager_version }}"
        release_namespace: cert-manager
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        binary_path: "{{ helm_binary_path }}"
        release_values:
          crds:
            enabled: true
        wait: true
        state: present
      run_once: true

    - name: Install Rancher
      kubernetes.core.helm:
        name: rancher
        chart_ref: rancher-stable/rancher
        chart_version: "{{ rancher_version }}"
        release_namespace: cattle-system
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        binary_path: "{{ helm_binary_path }}"
        release_values:
          hostname: "{{ rancher_hostname }}"
          replicas: "{{ rancher_replicas }}"
          ingress:
            ingressClassName: "{{ rancher_ingress_class }}"
            tls:
              source: rancher
          certmanager:
            version: "{{ cert_manager_version }}"
        wait: true
        state: present
      run_once: true
